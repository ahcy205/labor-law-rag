[project]
name = "labor-law-rag"
version = "0.1.0"
description = "한국 근로 제도 질문에 공개 문서 근거로 답하는 RAG와 평가 실험"
readme = "README.md"
authors = [
    { name = "ahcy205", email = "ahcy205@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "gradio==6.32.0",
    "httpx==0.28.1",
    "lxml==6.1.3",
    "numpy==2.5.5",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "typer==0.29.1",
]

[project.scripts]
llr = "labor_law_rag.cli:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# B008: typer.Option 기본값 관례, UP047: 3.12 제네릭 문법은 강제하지 않음, C408: 테스트의 dict() 허용
ignore = ["B008", "UP047", "C408"]
